# Paths come from .env (see .env.example). Compose does not expand "~": use absolute paths.
name: cc-runtime

x-dev-machine: &dev-machine
  image: ${DEV_IMAGE:-ghcr.io/zeke-chin/cc-runtime:latest}
  entrypoint: [/bin/bash, /usr/local/bin/entrypoint.sh]
  restart: unless-stopped
  cap_drop: [NET_RAW]
  sysctls:
    net.ipv6.conf.all.disable_ipv6: "1"

x-bind: &bind
  type: bind
  bind:
    create_host_path: false

services:
  # Single development machine `dev`; egress via `proxy-dmit`.
  # Both company (/Users/axis/weimob/projects) and personal (/Users/axis/projects)
  # Mac workspaces are bind-mounted directly at the same paths.
  # Claude Code's Bash commands run on the Mac through remote-shell.
  dev:
    <<: *dev-machine
    hostname: f78404c51ff2
    depends_on:
      proxy-dmit:
        condition: service_healthy
    environment:
      PASSWORD: ${PASSWORD:?Set PASSWORD in .env}
      TZ: America/New_York
      PYTHONPYCACHEPREFIX: /home/dev/.cache/python/pycache
      XDG_CACHE_HOME: /home/dev/.cache
      WORKSPACE_DIR: ${WORKSPACE_DIR}
      DOWNLOADS_DIR: ${DOWNLOADS_DIR}
      # Written by entrypoint.sh as a managed-settings drop-in (CLAUDE_CODE_TMPDIR).
      CC_REMOTE_SHELL_TMPDIR: ${RUNTIME_DIR}/remote-shell/dev/tmp
    volumes:
      - {<<: *bind, source: ./dev-runtimes/dev/ssh-host-keys, target: /var/lib/cc-runtime/ssh}
      - {<<: *bind, source: ./dev-runtimes/dev/machine-id, target: /etc/machine-id, read_only: true}
      - {<<: *bind, source: ./dev-runtimes/dev/machine-info, target: /etc/machine-info, read_only: true}
      - {<<: *bind, source: ./dev-runtimes/dev/machine-id, target: /var/lib/dbus/machine-id, read_only: true}
      - {<<: *bind, source: ./dev-runtimes/dev/home, target: /home/dev}
      # Direct same-path Mac workspace mounts (company + personal) and Downloads.
      - {<<: *bind, source: "${WORKSPACE_DIR:?Set WORKSPACE_DIR in .env}", target: "${WORKSPACE_DIR}"}
      - {<<: *bind, source: /Users/axis/projects, target: /Users/axis/projects}
      - {<<: *bind, source: "${DOWNLOADS_DIR:?Set DOWNLOADS_DIR in .env}", target: "${DOWNLOADS_DIR}"}
      # remote-shell: client.json (read-only), shared temp dir, T3 worktrees dir, and Linux client bin.
      - {<<: *bind, source: "${RUNTIME_DIR:?Set RUNTIME_DIR in .env}/remote-shell/dev", target: /var/lib/cc-runtime/remote-shell, read_only: true}
      - {<<: *bind, source: "${RUNTIME_DIR}/remote-shell/dev/tmp", target: "${RUNTIME_DIR}/remote-shell/dev/tmp"}
      - {<<: *bind, source: "${RUNTIME_DIR}/t3-worktrees/dev", target: "${RUNTIME_DIR}/t3-worktrees/dev"}
      - {<<: *bind, source: "${RUNTIME_DIR}/bin", target: /opt/cc-runtime/bin, read_only: true}
      - type: volume
        source: cache
        target: /home/dev/.cache
        volume: {nocopy: true, subpath: "${DEV_CACHE:-dev}"}
      - ./scripts/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./proxy/resolv.conf:/etc/resolv.conf:ro
    networks:
      private:
        ipv4_address: 172.30.0.10

  # Inbound: tailnet SSH to dev (Serve). Outbound: SOCKS5 listener for tailnet access.
  tailscale:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    entrypoint: [/bin/sh, /scripts/tailscale-entrypoint.sh]
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-cc-dev}
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_BOOT_TIMEOUT: 30m
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
      TS_SOCKS5_SERVER: 172.30.0.3:1055
      SOCKS5_PORT: "1055"
      SOCKS5_CLIENTS: "172.30.0.2"
    volumes:
      - ./scripts/tailscale-entrypoint.sh:/scripts/tailscale-entrypoint.sh:ro
      - type: bind
        source: ./tailscale/state
        target: /var/lib/tailscale
        bind:
          create_host_path: false
      - ./tailscale/config:/config:ro
    networks:
      private:
        ipv4_address: 172.30.0.3
      outbound: {}

  proxy-dmit:
    image: metacubex/mihomo:latest
    environment:
      PASSWORD: ${PASSWORD:?Set PASSWORD in .env}
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    entrypoint: [/bin/sh, /scripts/proxy-entrypoint.sh]
    volumes:
      - ./scripts/proxy-entrypoint.sh:/scripts/proxy-entrypoint.sh:ro
      - type: bind
        source: ./proxy/config-dev.yaml
        target: /root/.config/mihomo/config.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      private:
        ipv4_address: 172.30.0.2
      outbound: {}
    ports:
      - "127.0.0.1:19090:9090"
      - "127.0.0.1:2222:10022"
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 9090 && nc -z 127.0.0.1 53"]
      interval: 5s
      timeout: 3s
      retries: 12

  dev-network-init:
    image: metacubex/mihomo:latest
    network_mode: service:dev
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    depends_on:
      dev:
        condition: service_started
    entrypoint: [/bin/sh, /scripts/dev-network-init.sh]
    volumes:
      - ./scripts/dev-network-init.sh:/scripts/dev-network-init.sh:ro

volumes:
  cache:
    external: true
    name: ${CACHE_VOLUME:-cc-runtime-cache}

networks:
  private:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.0.0/24
  outbound:
    enable_ipv6: false
