services:
  dev:
    image: ghcr.io/zeke-chin/cc-runtime:latest
    entrypoint: [/bin/bash, /usr/local/bin/entrypoint.sh]
    restart: unless-stopped
    cap_drop: [NET_RAW]
    network_mode: service:dev-network-init
    depends_on:
      proxy:
        condition: service_healthy
      dev-network-init:
        condition: service_healthy
        restart: true
    environment:
      PASSWORD: ${PASSWORD:?Set PASSWORD in .env}
      TZ: America/New_York
      HERDR_SOCKET_PATH: /run/herdr/herdr.sock
    volumes:
      - type: bind
        source: ./dev-runtime/ssh-host-keys
        target: /var/lib/cc-runtime/ssh
        bind:
          create_host_path: false
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - type: bind
        source: ./dev-runtime/home
        target: /home/dev
        bind:
          create_host_path: false
      - type: bind
        source: ${WORKSPACE_PATH:?Set WORKSPACE_PATH in .env}
        target: /home/dev/workspace
        bind:
          create_host_path: false
      - type: bind
        source: ${PERSONAL_WORKSPACE_PATH:?Set PERSONAL_WORKSPACE_PATH in .env}
        target: /home/dev/personal
        bind:
          create_host_path: false
      - ./proxy/resolv.conf:/etc/resolv.conf:ro
      # Only sockets are temporary; ~/.config/herdr stays in the persistent home.
      - type: tmpfs
        target: /run/herdr
        tmpfs:
          size: 16777216

  tailscale:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-cc-dev}
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      # Allow time for the first interactive browser login (default is only 60s).
      TS_BOOT_TIMEOUT: 30m
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - type: bind
        source: ./tailscale/state
        target: /var/lib/tailscale
        bind:
          create_host_path: false
      - ./tailscale/config:/config:ro
    networks:
      private:
        ipv4_address: 172.30.0.3
      outbound: {}

  proxy:
    image: metacubex/mihomo:v1.19.19
    environment:
      PASSWORD: ${PASSWORD:?Set PASSWORD in .env}
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    entrypoint: [/bin/sh, /scripts/proxy-entrypoint.sh]
    volumes:
      # Mount the directory, not a single file: replacing a bind-mounted file on
      # the host would otherwise leave the container with a stale mount point.
      - ./scripts/containers:/scripts:ro
      - type: bind
        source: ./proxy/config.yaml
        target: /root/.config/mihomo/config.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      private:
        ipv4_address: 172.30.0.2
      outbound:
        gw_priority: 1
    ports:
      - "127.0.0.1:19090:9090"
      - "127.0.0.1:2222:10022"
      - "127.0.0.1:5901:15901"
      - "127.0.0.1:6080:16080"
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 9090 && nc -z 127.0.0.1 53"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Own the stable network namespace so restarting dev preserves its routes.
  # It never receives the proxy config or credentials.
  dev-network-init:
    image: metacubex/mihomo:v1.19.19
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    networks:
      private:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: [CMD, /bin/sh, /scripts/dev-network-init.sh, --check]
      interval: 5s
      timeout: 3s
      retries: 12
    entrypoint: [/bin/sh, /scripts/dev-network-init.sh]
    volumes:
      # Mount the directory, not a single file (see the proxy service above).
      - ./scripts/containers:/scripts:ro

networks:
  private:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.inhibit_ipv4: "true"
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.0.0/24
  outbound:
    enable_ipv6: false

