# US airport failover -> DMIT VLESS Reality exit. Fill all REPLACE_ fields.
mode: rule
log-level: info
ipv6: false
allow-lan: true
bind-address: '*'
redir-port: 7893
proxies:
# Replace these entries with complete US nodes from your Clash subscription.
# Keep the experimental node first; preserve each node's protocol options.
- name: airport-us-experimental
  type: ss
  server: REPLACE_AIRPORT_SERVER
  port: 443
  cipher: chacha20-ietf-poly1305
  password: REPLACE_AIRPORT_PASSWORD
- name: airport-us-backup
  type: ss
  server: REPLACE_BACKUP_SERVER
  port: 443
  cipher: chacha20-ietf-poly1305
  password: REPLACE_BACKUP_PASSWORD
- name: dmit-us
  type: vless
  server: REPLACE_SERVER
  port: 443
  uuid: REPLACE_UUID
  tls: true
  udp: true
  servername: REPLACE_SERVERNAME
  client-fingerprint: chrome
  reality-opts:
    public-key: REPLACE_PUBLIC_KEY
    short-id: REPLACE_SHORT_ID
  network: tcp
  dialer-proxy: airport-us
proxy-groups:
- name: airport-us
  type: fallback
  proxies:
  - airport-us-experimental
  - airport-us-backup
  url: https://www.gstatic.com/generate_204
  interval: 60
  timeout: 5000
  lazy: false
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  enhanced-mode: redir-host
  prefer-h3: false
  use-hosts: false
  use-system-hosts: false
  # Plain UDP resolvers: DoH endpoints such as 1.1.1.1 are unreachable from
  # mainland China, and this bootstrap path must work before any tunnel exists.
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  # Bootstrap airport hostnames using resolvers reachable from the host network.
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    +.corp.example.com: system
    +.internal.example.com: system
    +.qa.example.com: system
    +.tencent.com: system
  nameserver:
  - https://1.1.1.1/dns-query#dmit-us
tunnels:
- network:
  - tcp
  address: 0.0.0.0:10022
  target: 172.30.0.10:22
  proxy: DIRECT
- network:
  - tcp
  address: 0.0.0.0:15901
  target: 172.30.0.10:5901
  proxy: DIRECT
- network:
  - tcp
  address: 0.0.0.0:16080
  target: 172.30.0.10:6080
  proxy: DIRECT
rules:
- DOMAIN-SUFFIX,corp.example.com,DIRECT
- DOMAIN-SUFFIX,internal.example.com,DIRECT
- DOMAIN-SUFFIX,qa.example.com,DIRECT
- DOMAIN-SUFFIX,tencent.com,DIRECT
- MATCH,dmit-us
